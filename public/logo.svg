<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 68" fill="none" width="100%" height="100%">
  <defs>
    <!-- Smooth Aura Filter for Emblem -->
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Monogram Emblem "R" with Infinity Ribbon / Loop in Pure White -->
  <g transform="translate(6, 6)">
    <!-- Ambient subtle background glow -->
    <rect x="0" y="0" width="56" height="56" rx="16" fill="#FFFFFF" opacity="0.08" />
    
    <!-- Outer Glassmorphic Rounded Frame -->
    <rect x="0.75" y="0.75" width="54.5" height="54.5" rx="15" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Stylized Modern "R" Glyph made of Precision Geometric Curves -->
    <!-- Left Vertical Stem -->
    <path d="M17 14 C17 13 18 12 19 12 L22 12 C23 12 24 13 24 14 L24 42 C24 43 23 44 22 44 L19 44 C18 44 17 43 17 42 Z" 
          fill="#FFFFFF" />

    <!-- Top Loop of "R" in Crisp White -->
    <path d="M22 12 L33 12 C39 12 43 15.5 43 21 C43 26.5 39 30 33 30 L22 30 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Dynamic Diagonal Kick Leg of "R" -->
    <path d="M28 28 L40 43 C40.8 44 42 44 43 43.5 L44 43 C44.8 42.2 44.5 41 43.8 40 L33 27 Z" 
          fill="#FFFFFF" 
          fill-opacity="0.9" />
    
    <path d="M29 29 L40 43" 
          stroke="#FFFFFF" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <!-- Center Core Spark Accent -->
    <circle cx="32" cy="21" r="2" fill="#FFFFFF" />
  </g>

  <!-- Typography Block in Clean Pure White -->
  <!-- "RUDO" -->
  <text x="76" y="38" 
        font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="34" 
        letter-spacing="5" 
        fill="#FFFFFF">
    RUDO
  </text>

  <!-- Sub-Brand: "MARKETING" in Crisp White -->
  <text x="77" y="54" 
        font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="9" 
        letter-spacing="6" 
        fill="#FFFFFF"
        opacity="0.92">
    MARKETING
  </text>
</svg>
